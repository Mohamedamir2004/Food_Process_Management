{% extends 'base.html' %}
{% block title %}Guest Page{% endblock %}

{% block content %}
<div class="guest-container">
  <h2>Available Food Processes</h2>
  <div class="items-grid">
    {% for item in items %}
      <div class="item-card">
        <img src="{{ item.image.url }}" alt="{{ item.name }}">
        <h4>{{ item.name }}</h4>
        <p>{{ item.description }}</p>
      </div>
    {% empty %}
      <p>No food processes available.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
